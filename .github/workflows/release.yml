name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install publish deps
        run: pip install kaggle huggingface_hub datasets

      - name: Kaggle — dataset version (auto-push on tag)
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          if [ -z "$KAGGLE_USERNAME" ]; then echo "KAGGLE secrets not set — skip"; exit 0; fi
          # kaggle CLI expects kaggle.json or env
          mkdir -p ~/.kaggle
          echo "{\"username\":\"$KAGGLE_USERNAME\",\"key\":\"$KAGGLE_KEY\"}" > ~/.kaggle/kaggle.json
          chmod 600 ~/.kaggle/kaggle.json
          kaggle datasets version -p kaggle --dir-mode zip -m "release ${{ github.ref_name }}" || kaggle datasets create -p kaggle --dir-mode zip

      - name: HF — push dataset
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then echo "HF_TOKEN not set — skip"; exit 0; fi
          python scripts/push_hf_dataset.py --repo ahmedarfaoui/signalrank-jobs

      - name: HF Space — sync (Docker)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then echo "HF_TOKEN not set — skip"; exit 0; fi
          # Space sync via huggingface_hub (Docker SDK auto-builds from hf/space)
          python -c "from huggingface_hub import HfApi; api=HfApi(token='$HF_TOKEN'); api.create_repo('ahmedarfaoui/signalrank', repo_type='space', space_sdk='docker', exist_ok=True)"
          huggingface-cli upload ahmedarfaoui/signalrank hf/space --repo-type space --commit-message "release ${{ github.ref_name }}" || true
