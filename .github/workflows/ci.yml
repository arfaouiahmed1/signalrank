name: ci
on:
  push:
    branches: [main]
  pull_request: {}

jobs:
  lint-test-eval:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: signalrank_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d signalrank_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install deps
        run: |
          pip install -r backend/requirements.txt
          pip install ruff pytest
      - name: Lint (ruff)
        run: |
          ruff check backend/ scripts/ || true
          ruff format --check backend/ scripts/ || true
      - name: Tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/signalrank_test
          PYTHONPATH: backend:.
        run: |
          pytest backend/tests -q
      - name: Build mini index + eval (hybrid-only, no CE — fast CI)
        env:
          PYTHONPATH: backend:.
        run: |
          python scripts/fetch_kaggle.py --sample 100 --out data/raw/jobs.jsonl
          python scripts/build_qrels.py --jobs data/raw/jobs.jsonl --cv data/sample/cv_sample.txt --out data/qrels.jsonl
          mkdir -p artifacts
          python backend/app/evaluation/compare.py --jobs data/raw/jobs.jsonl --qrels data/qrels.jsonl --cv data/sample/cv_sample.txt --mode hybrid-only --out artifacts/metrics.json
          cat artifacts/metrics.json
      - uses: actions/upload-artifact@v4
        with:
          name: metrics
          path: artifacts/metrics.json
      - name: Gate — hybrid must beat embedding-only
        run: |
          python scripts/assert_metrics.py --metrics artifacts/metrics.json --min-ndcg 0.25
