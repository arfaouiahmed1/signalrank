version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule: { interval: weekly }
    labels: [dependencies, security]
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    labels: [dependencies, security]
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directory: /infra
    schedule: { interval: weekly }
    labels: [dependencies, security]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    labels: [dependencies, security]
