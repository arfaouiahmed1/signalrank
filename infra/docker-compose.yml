services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: signalrank
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../backend/db/pgvector_init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d signalrank"]
      interval: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/signalrank
      EMBED_MODEL: sentence-transformers/all-MiniLM-L6-v2
      CE_MODEL: cross-encoder/ms-marco-MiniLM-L-6-v2
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - ../data:/app/data:ro
      - ../artifacts:/app/artifacts
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: infra/Dockerfile.frontend
    ports:
      - "3000:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
