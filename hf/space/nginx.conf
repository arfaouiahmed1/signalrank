events {}
http {
    include /etc/nginx/mime.types;
    server {
        listen 7860;
        root /app/frontend/dist;
        index index.html;
        location /api/ { proxy_pass http://127.0.0.1:8000/; }
        location /health { proxy_pass http://127.0.0.1:8000/health; }
        location / { try_files $uri $uri/ /index.html; }
    }
}
